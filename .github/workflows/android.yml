name: Android build and unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK tools
        uses: android-actions/setup-android@v3
      - name: Install platform SDK
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
      - name: Build debug APK and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: folio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
